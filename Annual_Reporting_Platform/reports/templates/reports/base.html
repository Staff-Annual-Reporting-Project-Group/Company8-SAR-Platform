<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Uwi Reporting Platform</title>
</head>
<body>
    <header class="w-full bg-gray-100 border-b border-gray-200 px-6 py-3">
  <div class="flex items-center justify-between ">

    <!-- Left: Logo -->
    <div class="text-lg font-semibold tracking-wide text-gray-700">
      DCIT REPORTS
    </div>

    <!-- Center: Search + Filter -->
    <div class="flex items-center gap-4 w-2/3">

      <!-- Search -->
      <form method="GET" action="{% url 'reports:index' %}" class="w-full">
        <div class="relative">
          <input 
            name="q"
            type="text"
            placeholder="Search By titles"
            class="w-full rounded-full border border-gray-300 bg-white px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-300"
          />
          <button 
            type="submit"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"
          >
            🔍
          </button>
        </div>
      </form>

      <!-- Filtering Button -->
      <button class="flex-row w-40  items-center gap-2 rounded-full border border-gray-300 bg-white px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">
        ⚙️ Filtering
      </button>

    </div>

    <!-- Right: Buttons -->
    <div class="flex items-center gap-1">

      <a href="#" 
         class="rounded-full border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
        📄 Annual Report
      </a>

      <a href="#" 
         class="rounded-full border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
        👤 Login
      </a>

    </div>

  </div>
</header>

    {%block body%}
        
    {%endblock%}
</body>
</html>
