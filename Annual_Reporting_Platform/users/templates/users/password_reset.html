{% extends "base.html" %}
{% block body %}

<div class="min-h-[calc(100vh-65px)] flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="w-full max-w-md">

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 px-8 py-10">

      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-blue-700 flex items-center justify-center mb-4 shadow-md">
          <span class="font-display text-white font-bold text-xl">UWI</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-gray-900">Forgot Password?</h1>
        <p class="text-sm text-gray-400 mt-1 text-center">Enter your email and we'll send you a reset link</p>
      </div>

      <form method="POST" class="space-y-5">
        {% csrf_token %}

        <div>
          <label for="id_email" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
            Email Address
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <input type="email" name="email" id="id_email"
              placeholder="your@email.com" autocomplete="email" required
              class="w-full rounded-xl border border-gray-200 bg-gray-50 pl-9 pr-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition"/>
          </div>
        </div>

        <button type="submit"
          class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm py-3 transition shadow-sm">
          Send Reset Link
        </button>
      </form>

      <p class="text-center text-sm text-gray-400 mt-6">
        Remembered it?
        <a href="{% url 'users:login' %}" class="text-blue-600 font-medium hover:underline">Back to login</a>
      </p>

    </div>

    <p class="text-center text-xs text-gray-400 mt-6">DCIT Reports &mdash; University of the West Indies</p>
  </div>
</div>

{% endblock %}
