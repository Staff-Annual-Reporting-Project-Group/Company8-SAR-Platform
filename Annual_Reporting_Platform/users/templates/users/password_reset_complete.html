{% extends "base.html" %}
{% block body %}

<div class="min-h-[calc(100vh-65px)] flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="w-full max-w-md">

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 px-8 py-10 text-center">

      <!-- Success icon -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h1 class="font-display text-2xl font-bold text-gray-900">Password Updated!</h1>
        <p class="text-sm text-gray-400 mt-2 leading-relaxed">
          Your password has been successfully reset.<br>
          You can now sign in with your new password.
        </p>
      </div>

      <a href="{% url 'users:login' %}"
         class="block w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm py-3 transition shadow-sm">
        Sign In Now
      </a>

    </div>

    <p class="text-center text-xs text-gray-400 mt-6">DCIT Reports &mdash; University of the West Indies</p>
  </div>
</div>

{% endblock %}
