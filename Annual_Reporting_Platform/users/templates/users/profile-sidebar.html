 <!-- Left Sidebar -->
  <aside
    class="w-[145px] shrink-0 bg-[#f5f5f5] border-r border-gray-200 flex flex-col"
  >
    <div class="px-3 pt-8 pb-5 text-center">
      <div
        class="w-[86px] h-[86px] mx-auto rounded-full border-[3px] border-gray-300 bg-gray-100 flex items-center justify-center overflow-hidden"
      >

        
        <img
          src="{{ user.profile_pic.profilePic.url }}"
          alt="Profile Picture"
          class="w-full h-full object-cover"
        />
       
        
      

      </div>

      <div class="mt-5">
        <div class="text-[14px] font-medium text-gray-800 leading-tight">
          {{ request.user.get_full_name|default:request.user.username }}
        </div>
        <div class="text-[9px] text-gray-500 mt-1 break-all">
          {{ request.user.email}}
        </div>
      </div>

      {% if request.user.is_authenticated %}
      <a
        href="{% url 'users:logout' %}"
        class="inline-block mt-4 px-4 py-1.5 rounded-full bg-[#f56b5b] hover:bg-[#e45848] text-white text-[10px] font-bold transition"
      >
        SIGN OUT
      </a>
      {% endif %}
    </div>

    <div class="border-t border-gray-200"></div>

    <nav class="px-3 py-4">
      <a
        href="{% url 'reports:index' %}"
        class="block text-[14px] font-semibold text-[#2383ff] py-1"
      >
        Reports
      </a>
      <a
        href="{% url 'users:profile' %}"
        class="block text-[14px] font-semibold text-gray-400 hover:text-gray-600 py-1"
      >
        Account Information
      </a>
      {% if request.user.is_superuser or request.user.is_staff or request.user.is_admin %}
        <a
          href="{% url 'administration:admin-accounts' %}"
          class="block text-[14px] font-semibold text-gray-400 hover:text-gray-600 py-1"
        >
          Admin Accounts
        </a>
      {% endif %}
    </nav>
  </aside>
