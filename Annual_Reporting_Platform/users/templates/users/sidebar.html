 <aside class="w-52 shrink-0 bg-white border-r border-gray-200 flex flex-col items-center pt-8 pb-6 px-4 gap-4">

    <!-- Avatar -->
    <div class="w-20 h-20 rounded-full bg-gray-100 border-2 border-gray-200 overflow-hidden flex items-center justify-center">
        <img src="{{ user.profile_pic.profilePic.url }}" alt="User Avatar" class="w-full h-full object-cover">
    </div>

    <!-- Name & Email -->
    <div class="text-center">
      <p class="font-semibold text-sm text-gray-800 leading-tight">{{ user.get_full_name|default:user.username }}</p>
      <p class="text-xs text-gray-400 mt-0.5 break-all">{{user.email}}</p>
    </div>

    <!-- Sign Out -->
    <a href="{%url 'users:logout' %}"
      class="px-4 py-1.5 rounded-full bg-red-500 hover:bg-red-600 text-white text-xs font-semibold transition">
      SIGN OUT
    </a>

    <nav class="w-full mt-2 space-y-1">

  <!-- My Reports -->
  <a href="{% url 'users:profile' %}"
     class="block w-full text-sm px-3 py-2 rounded-lg transition
     {% if page == 'reports' %}
       font-semibold text-blue-600 bg-blue-50
     {% else %}
       text-gray-500 hover:text-gray-800 hover:bg-gray-50
     {% endif %}">
    My Reports
  </a>

  <!-- Annual Report -->
  <a href=""
     class="block w-full text-sm px-3 py-2 rounded-lg transition
     {% if page == 'annual' %}
       font-semibold text-blue-600 bg-blue-50
     {% else %}
       text-gray-500 hover:text-gray-800 hover:bg-gray-50
     {% endif %}">
    Annual Report
  </a>

  <!-- Account Info -->
  <a href=""
     class="block w-full text-sm px-3 py-2 rounded-lg transition
     {% if page == 'account' %}
       font-semibold text-blue-600 bg-blue-50
     {% else %}
       text-gray-500 hover:text-gray-800 hover:bg-gray-50
     {% endif %}">
    Account Information
  </a>

</nav>
  </aside>
